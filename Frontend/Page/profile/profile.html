<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Codex — โปรไฟล์</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container" style="padding-top:2rem; padding-bottom:3rem">
    <!-- Profile Header -->
    <div class="profile-header">
      <div class="avatar-wrap" onclick="document.getElementById('avatar-input').click()">
        <div class="avatar" id="avatar-display">?</div>
        <div class="avatar-overlay">📷</div>
        <input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="openCropModal(event)">
      </div>
      <div style="flex:1">
        <div class="profile-name" id="profile-name">กำลังโหลด...</div>
        <div style="color:var(--text-muted)" id="profile-email"></div>
        <div style="color:var(--text-muted); font-size:0.9rem; margin-top:0.25rem" id="profile-desc"></div>
        <div style="margin-top:0.75rem; display:flex; gap:0.5rem; flex-wrap:wrap" id="profile-badges"></div>
      </div>
      <button class="btn btn-outline" onclick="openEditModal()">✏️ แก้ไขโปรไฟล์</button>
    </div>

    <!-- Stats -->
    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:1rem; margin-bottom:2rem">
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(108,99,255,0.2)">📚</div>
        <div><div class="stat-value" id="stat-enrolled">-</div><div class="stat-label">คอร์สที่ลงทะเบียน</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(67,217,173,0.2)">✅</div>
        <div><div class="stat-value" id="stat-completed">-</div><div class="stat-label">บทเรียนที่เรียนแล้ว</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(255,179,71,0.2)">🏆</div>
        <div><div class="stat-value" id="stat-score">-</div><div class="stat-label">คะแนนเฉลี่ย</div></div>
      </div>
    </div>

    <!-- Progress per course -->
    <div class="page-title" style="margin-bottom:1rem; font-size:1.3rem">📊 ความคืบหน้าในแต่ละคอร์ส</div>
    <div id="progress-list"><div class="spinner"></div></div>
  </div>

  <!-- CROP MODAL -->
  <div class="modal-overlay" id="crop-modal">
    <div class="modal" style="max-width:520px">
      <div class="modal-title">✂️ ครอปรูปโปรไฟล์</div>
      <div class="crop-container" id="crop-container"
           onmousedown="startDrag(event)" ontouchstart="startDrag(event)"
           onmousemove="doDrag(event)" ontouchmove="doDrag(event)"
           onmouseup="stopDrag()" ontouchend="stopDrag()">
        <img id="crop-image" draggable="false">
        <div class="crop-overlay"><div class="crop-circle"></div></div>
      </div>

      <div class="crop-controls">
        <span style="color:var(--text-muted); font-size:0.85rem">🔍 ซูม</span>
        <input type="range" id="zoom-slider" min="0.5" max="3" step="0.01" value="1" oninput="updateZoom()">
        <div class="preview-circle">
          <canvas id="preview-canvas" width="80" height="80"></canvas>
        </div>
      </div>

      <div style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1rem; text-align:center">
        ลากรูปเพื่อเลือกตำแหน่ง • เลื่อน slider เพื่อซูม
      </div>

      <div style="display:flex; gap:1rem">
        <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="applyCrop()">✅ ใช้รูปนี้</button>
        <button class="btn btn-outline" onclick="closeCropModal()">ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <div class="modal-title">✏️ แก้ไขโปรไฟล์</div>
      <div id="edit-alert" class="alert"></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem">
        <div class="form-group"><label class="form-label">ชื่อ</label><input type="text" id="edit-firstname" class="form-control"></div>
        <div class="form-group"><label class="form-label">นามสกุล</label><input type="text" id="edit-lastname" class="form-control"></div>
      </div>
      <div class="form-group"><label class="form-label">อีเมล</label><input type="email" id="edit-email" class="form-control"></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem">
        <div class="form-group"><label class="form-label">อายุ</label><input type="number" id="edit-age" class="form-control"></div>
        <div class="form-group"><label class="form-label">เพศ</label>
          <select id="edit-gender" class="form-control">
            <option value="">-- เลือก --</option>
            <option value="ชาย">ชาย</option>
            <option value="หญิง">หญิง</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label class="form-label">แนะนำตัวเอง</label><textarea id="edit-description" class="form-control" rows="2"></textarea></div>
      <div style="display:flex; gap:1rem; margin-top:1rem">
        <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="saveProfile()">💾 บันทึก</button>
        <button class="btn btn-outline" onclick="closeModal('edit-modal')">ยกเลิก</button>
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/navbar.js"></script>
  <script src="profile.js"></script>
  <script></script>
</body>

</html>
