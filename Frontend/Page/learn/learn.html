<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Codex — เรียน</title>
  <link rel="stylesheet" href="/Frontend/assets/css/style.css">
  <style>
    .learn-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.5rem;
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      min-height: calc(100vh - 70px);
    }

    .lesson-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(108, 99, 255, 0.2);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .content-area {
      background: var(--dark2);
      border-radius: var(--radius);
      border: 1px solid rgba(108, 99, 255, 0.15);
      padding: 2rem;
      min-height: 400px;
    }

    .lesson-title {
      font-family: 'Baloo 2', cursive;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--white);
      margin-bottom: 1rem;
    }

    .lesson-content {
      color: var(--text);
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    .quiz-section {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid rgba(108, 99, 255, 0.2);
      padding: 1.5rem;
      margin-top: 2rem;
    }

    .quiz-header {
      font-family: 'Baloo 2', cursive;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--accent2);
    }

    .quiz-question {
      background: rgba(255, 255, 255, 0.03);
      border-radius: var(--radius-sm);
      padding: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .question-text {
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--white);
    }

    .result-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .result-correct {
      background: rgba(67, 217, 173, 0.2);
      color: var(--accent1);
    }

    .result-wrong {
      background: rgba(255, 101, 132, 0.2);
      color: var(--secondary);
    }

    /* Fallback quiz styles */
    .quiz-option {
      background: #f8f9ff;
      border: 2px solid #ddd;
      border-radius: 10px;
      padding: 0.9rem 1.2rem;
      margin-bottom: 0.6rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 1rem;
      font-weight: 600;
      color: #333;
    }

    .quiz-option:hover {
      border-color: #6C63FF;
      background: #f0eeff;
    }

    .quiz-option.selected {
      border-color: #6C63FF;
      background: #e8e4ff;
    }

    .quiz-option.correct {
      border-color: #43D9AD;
      background: #e6fff8;
    }

    .quiz-option.wrong {
      border-color: #FF6584;
      background: #fff0f3;
    }

    .option-label {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #ede9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #6C63FF;
      flex-shrink: 0;
    }

    .quiz-section {
      background: #f5f5ff;
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 1.5rem;
      border: 1px solid #e0dcff;
    }

    .quiz-header {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 1.2rem;
      color: #e67e22;
    }

    .question-text {
      font-weight: 700;
      margin-bottom: 0.8rem;
      color: #222;
    }

    .quiz-question {
      background: white;
      border-radius: 10px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .result-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .result-correct {
      background: #e6fff8;
      color: #00a86b;
    }

    .result-wrong {
      background: #fff0f3;
      color: #e63946;
    }

    .score-box-inner {
      background: linear-gradient(135deg, #43D9AD, #6C63FF);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      margin-top: 1rem;
      color: white;
    }

    .score-box {
      background: var(--gradient2);
      border-radius: var(--radius);
      padding: 1.5rem;
      text-align: center;
      margin-top: 1rem;
    }

    .score-num {
      font-family: 'Baloo 2', cursive;
      font-size: 3rem;
      font-weight: 800;
      color: white;
    }

    @media (max-width: 768px) {
      .learn-layout {
        grid-template-columns: 1fr;
      }
    }
    </style>
</head>

<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="learn-layout">
    <!-- Sidebar -->
    <div>
      <div class="lesson-sidebar">
        <div style="padding:1rem 1.2rem; border-bottom:1px solid rgba(108,99,255,0.2)">
          <div style="font-family:'Baloo 2',cursive; font-weight:800; color:var(--white)" id="course-name">กำลังโหลด...
          </div>
          <div style="margin-top:0.75rem">
            <div
              style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-muted); margin-bottom:0.4rem">
              <span>ความคืบหน้า</span>
              <span id="progress-text">0%</span>
            </div>
            <div class="progress">
              <div class="progress-bar" id="progress-bar" style="width:0%"></div>
            </div>
          </div>
        </div>
        <div id="lesson-list">
          <div style="padding:1rem; color:var(--text-muted); text-align:center">กำลังโหลด...</div>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="content-area" id="content-area">
      <div class="empty-state">
        <div class="empty-state-icon">👆</div>
        <div class="empty-state-text">เลือกบทเรียนจากด้านซ้าย</div>
      </div>
    </div>
  </div>

  <script src="/Frontend/js/api.js"></script>
  <script src="/Frontend/js/navbar.js"></script>
  <script src="learn.js"></script>
  <script>
  </script>
</body>

</html>
