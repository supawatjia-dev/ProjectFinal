<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Codex — คอร์สทั้งหมด</title>
  <link rel="stylesheet" href="/Frontend/assets/css/style.css">
  <style>
    .search-bar {
      background: var(--dark2);
      border-radius: 50px;
      border: 1px solid rgba(108, 99, 255, 0.2);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      max-width: 500px;
    }

    .search-bar input {
      background: none;
      border: none;
      color: var(--white);
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      flex: 1;
      outline: none;
    }

    .course-colors {
      background-image: linear-gradient(135deg, var(--c1), var(--c2));
    }
  </style>
</head>

<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container" style="padding-top:2rem">
    <div class="page-header"
      style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; padding:0 0 1.5rem">
      <div>
        <div class="page-title">📚 คอร์สทั้งหมด</div>
        <div class="page-subtitle">เลือกเรียนคอร์สที่คุณสนใจ</div>
      </div>
      <div class="search-bar">
        <span>🔍</span>
        <input type="text" id="search" placeholder="ค้นหาคอร์ส..." oninput="filterCourses()">
      </div>
    </div>

    <div id="courses-grid" class="grid-3">
      <div style="grid-column:1/-1; text-align:center; padding:3rem">
        <div class="spinner"></div>
        <div style="color:var(--text-muted); margin-top:1rem">กำลังโหลดคอร์ส...</div>
      </div>
    </div>
  </div>

  <script src="/Frontend/js/api.js"></script>
  <script src="/Frontend/js/navbar.js"></script>
  <script src="courses.js"></script>
  <script>
  </script>
</body>

</html>
